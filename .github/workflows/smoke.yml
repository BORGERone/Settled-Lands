name: Integration suite

# Набор запускает настоящий выделенный сервер и выполняет 117 проверок на чистом мире
# (119 при повторном запуске на том же мире — срабатывают две проверки рестарта).
# Он тяжелее обычной сборки, поэтому по умолчанию запускается вручную
# (вкладка Actions -> Integration suite -> Run workflow) и на push в main.
on:
  workflow_dispatch:
  push:
    # ВРЕМЕННО: ветка добавлена, чтобы реально прогнать набор на новом smoke.yml
    # (токен сессии не может запустить workflow_dispatch через API).
    # После прогона строка убирается, остаётся только main.
    branches: [main, arena/01a0ec40-settled-lands]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'smoke-server/**'
      - '.github/workflows/smoke.yml'

permissions:
  contents: read
  # ВРЕМЕННО: маркер результата пишем в комментарий PR, потому что из песочницы
  # не читаются ни логи, ни артефакты. После прогона блок удаляется.
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Prepare the test world
        run: |
          mkdir -p run-smoke
          cp smoke-server/server.properties run-smoke/server.properties
          echo "eula=true" > run-smoke/eula.txt

      - name: Run the integration suite
        run: ./gradlew runServer -PsanctitySmoke --no-daemon

      - name: Show the result
        if: always()
        run: |
          echo "=== marker ==="
          cat run-smoke/sanctity-smoke-result.txt || echo "marker missing"
          echo "=== checks ==="
          grep -a "CHECK OK" run-smoke/logs/latest.log | tail -n 40 || true
          echo "=== tail of the log ==="
          tail -n 60 run-smoke/logs/latest.log || true
          {
            echo "### Результат набора"
            echo '```'
            cat run-smoke/sanctity-smoke-result.txt 2>/dev/null || echo "маркер не найден"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ВРЕМЕННО: маркер и число проверок в комментарий PR #2
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          marker=$(cat run-smoke/sanctity-smoke-result.txt 2>/dev/null || echo "маркер не найден")
          count=$(grep -ac "CHECK OK" run-smoke/logs/latest.log 2>/dev/null || echo 0)
          {
            echo "Результат прогона Integration suite ${{ github.run_id }}"
            echo ""
            echo '```'
            echo "$marker"
            echo '```'
            echo "Строк CHECK OK в журнале: $count"
          } > /tmp/comment.md
          gh pr comment 2 --repo "$GH_REPO" --body-file /tmp/comment.md

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-log
          if-no-files-found: warn
          path: |
            run-smoke/logs/latest.log
            run-smoke/sanctity-smoke-result.txt
            run-smoke/table-report.txt
