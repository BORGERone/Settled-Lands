name: Publish release

# Публикует релиз: берёт JAR из артефакта указанного прогона Build и вешает
# его на тег, поставленный на нужный коммит ветки main.
#
# Зачем: в песочнице без JDK и с закрытым хранилищем артефактов скачать JAR
# нельзя, а Actions — может. Так релиз всегда собирается из артефакта CI,
# а не из файла, сделанного руками.
#
# ВАЖНО: запускать только ПОСЛЕ влития правок в main. GitHub не даёт токену
# Actions создать релиз на коммите, которого нет в ветке по умолчанию
# (ошибка 403 «Resource not accessible by integration»), а если указать HEAD
# самого прогона — релиз создаётся черновиком. Проверено 29.09.2026.
#
# Как запустить: Actions -> Publish release -> Run workflow -> заполнить
# run_id и target_sha (коммит в main), остальное уже заполнено.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID прогона Build, откуда взять JAR (например 36547119457)'
        required: true
        type: string
      target_sha:
        description: 'Коммит в main, на который встанет тег'
        required: true
        type: string
      tag:
        description: 'Тег релиза'
        required: false
        default: 'v0.5.1'
        type: string
      title:
        description: 'Заголовок релиза'
        required: false
        default: '0.5.1'
        type: string
      notes_file:
        description: 'Файл с описанием релиза (в репозитории)'
        required: false
        default: 'RELEASE-NOTES-0.5.1.md'
        type: string
      artifact_name:
        description: 'Имя артефакта с JAR'
        required: false
        default: 'settledlands-jar'
        type: string
      dry_run:
        description: 'Только скачать и показать, релиз не создавать'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # создание релиза и тега
  actions: read     # скачивание артефакта чужого прогона

env:
  RUN_ID: ${{ inputs.run_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TAG: ${{ inputs.tag || 'v0.5.1' }}
  TITLE: ${{ inputs.title || '0.5.1' }}
  NOTES_FILE: ${{ inputs.notes_file || 'RELEASE-NOTES-0.5.1.md' }}
  ARTIFACT_NAME: ${{ inputs.artifact_name || 'settledlands-jar' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout (за описанием релиза)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Пропустить, если релиз уже published
        id: guard
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует — публикацию пропускаем."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Проверить, что тег встанет на коммит из main
        if: steps.guard.outputs.skip == 'false'
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Коммит $TARGET_SHA достижим из main — можно публиковать."
          else
            echo "ОШИБКА: коммит $TARGET_SHA не достижим из main."
            echo "GitHub не даст создать на нём релиз (403). Сначала влейте правки в main."
            exit 1
          fi

      - name: Скачать JAR из артефакта прогона ${{ env.RUN_ID }}
        if: steps.guard.outputs.skip == 'false'
        run: |
          rm -rf dist-jar
          gh run download "$RUN_ID" -n "$ARTIFACT_NAME" -D dist-jar --repo "$GH_REPO"

      - name: Показать, что скачали
        if: steps.guard.outputs.skip == 'false'
        run: |
          ls -lR dist-jar
          # JAR ищем через find: в артефакте он может лежать и в build/libs/.
          JAR_PATH="$(find dist-jar -name '*.jar' | head -1)"
          if [ -z "$JAR_PATH" ]; then
            echo "В артефакте $ARTIFACT_NAME нет ни одного JAR"
            exit 1
          fi
          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"
          sha256sum "$JAR_PATH"
          # Содержимое пишем в файл и только потом фильтруем: канал
          # unzip | grep | head обрывается по SIGPIPE, а в Actions включён pipefail.
          unzip -l "$JAR_PATH" > jar-list.txt
          grep -E 'neoforge.mods.toml|settledlands' jar-list.txt | head -20 || true

      - name: Создать релиз
        if: steps.guard.outputs.skip == 'false' && env.DRY_RUN != 'true'
        run: |
          gh release create "$TAG" "$JAR_PATH" \
            --repo "$GH_REPO" \
            --target "$TARGET_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE"

      - name: Проверить результат
        if: steps.guard.outputs.skip == 'false' && env.DRY_RUN != 'true'
        run: |
          gh release view "$TAG" --repo "$GH_REPO"

      - name: Отпечаток опубликованного файла (в описание релиза)
        # Скачиваем ровно тот файл, который лежит в релизе, и дописываем его
        # размер и sha256 в описание: игрок может сверить скачанное.
        if: env.DRY_RUN != 'true'
        run: |
          rm -rf verify-jar
          gh release download "$TAG" -D verify-jar --repo "$GH_REPO"
          JAR_PATH="$(find verify-jar -name '*.jar' | head -1)"
          JAR_NAME="$(basename "$JAR_PATH")"
          JAR_SIZE="$(wc -c < "$JAR_PATH")"
          JAR_SHA="$(sha256sum "$JAR_PATH" | cut -d' ' -f1)"
          echo "Файл: $JAR_NAME, $JAR_SIZE байт, sha256 $JAR_SHA"
          cp "$NOTES_FILE" /tmp/release-notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "## Контрольная сумма"
            echo ""
            echo "Файл \`$JAR_NAME\` — $JAR_SIZE байт, sha256:"
            echo ""
            echo '```'
            echo "$JAR_SHA"
            echo '```'
            echo ""
            echo "Сверить скачанное можно так: \`sha256sum $JAR_NAME\` (Linux, macOS),"
            echo "или \`certutil -hashfile $JAR_NAME SHA256\` (Windows)."
          } >> /tmp/release-notes.md
          gh release edit "$TAG" --repo "$GH_REPO" --notes-file /tmp/release-notes.md
