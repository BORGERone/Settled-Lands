name: Token check

# ВРЕМЕННЫЙ workflow: ищем, на каком именно вызове gh release create получает 403.
# Удаляется сразу после проверки.

on:
  push:
    paths:
      - '.github/workflows/token-check.yml'

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Подготовить файлы
        run: |
          echo "примечания" > notes.md
          echo "test" > test-asset.txt
          echo "$GITHUB_SHA"

      - name: Попытки
        run: |
          {
            echo "Прогон ${{ github.run_id }}, коммит $GITHUB_SHA"
            echo ""
            echo "=== A: gh release create с --target (как в publish-release)"
            gh release create v-tc-a test-asset.txt --repo "$GH_REPO" \
              --target "$GITHUB_SHA" --title "tc-a" --notes-file notes.md 2>&1
            echo "код: $?"
            echo ""
            echo "=== B: gh api POST /releases (без --target)"
            gh api -X POST "repos/$GH_REPO/releases" -f tag_name=v-tc-b -f name=tc-b -f body=temp 2>&1
            echo "код: $?"
            echo ""
            echo "=== C: gh release create без --target"
            gh release create v-tc-c test-asset.txt --repo "$GH_REPO" --title "tc-c" --notes-file notes.md 2>&1
            echo "код: $?"
            echo ""
            echo "=== D: только создание тега через git ref"
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/v-tc-d -f sha="$GITHUB_SHA" 2>&1
            echo "код: $?"
          } > check.txt 2>&1

      - name: Уборка
        if: always()
        run: |
          for tag in v-tc-a v-tc-b v-tc-c v-tc-d; do
            gh api -X DELETE "repos/$GH_REPO/releases/tags/$tag" >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
          done
          echo "уборка сделана" >> check.txt

      - name: Результат в комментарий PR #2
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment 2 --repo "$GH_REPO" --body-file check.txt || true
