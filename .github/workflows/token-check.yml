name: Token check

# ВРЕМЕННЫЙ workflow: ищем, на каком именно вызове gh release create получает 403.
# Удаляется сразу после проверки.

on:
  push:
    paths:
      - '.github/workflows/token-check.yml'

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Подготовить файлы
        run: |
          echo "примечания" > notes.md
          echo "test" > test-asset.txt
          echo "$GITHUB_SHA"

      - name: Попытки
        run: |
          {
            echo "Прогон ${{ github.run_id }}, коммит $GITHUB_SHA"
            echo ""
            echo "=== точные параметры как в publish-release (тег v0.5.1, --target c13e1ee)"
            gh release create "v0.5.1" test-asset.txt --repo "$GH_REPO" \
              --target "c13e1ee4c79d114518fc5a5286ffc0c626ba50df" \
              --title "0.5.1" --notes-file "RELEASE-NOTES-0.5.1.md" 2>&1
            echo "код: $?"
            echo ""
            echo "=== тот же тег, но --verify-tag и --latest"
            gh release view "v0.5.1" --repo "$GH_REPO" --json draft,isDraft,tagName 2>&1
            echo "код: $?" 
          } > check.txt 2>&1

      - name: Уборка
        if: always()
        run: |
          for tag in v0.5.1; do
            gh api -X DELETE "repos/$GH_REPO/releases/tags/$tag" >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
          done
          echo "уборка сделана" >> check.txt

      - name: Результат в комментарий PR #2
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment 2 --repo "$GH_REPO" --body-file check.txt || true
