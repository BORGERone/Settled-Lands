name: Token check

# ВРЕМЕННЫЙ workflow: ищем, на каком именно вызове gh release create получает 403.
# Удаляется сразу после проверки.

on:
  push:
    paths:
      - '.github/workflows/token-check.yml'

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Подготовить файлы
        run: |
          echo "примечания" > notes.md
          echo "test" > test-asset.txt
          echo "$GITHUB_SHA"

      - name: Попытки
        run: |
          {
            echo "Прогон ${{ github.run_id }}, коммит $GITHUB_SHA"
            echo ""
            echo "=== E: v0.5.4 --target 82ce611 (HEAD ветки main)"
            gh release create "v0.5.4" test-asset.txt --repo "$GH_REPO" \
              --target "82ce611c36150be332f72413e882bb95f53b65b1" \
              --title "0.5.4" --notes-file notes.md 2>&1
            echo "код: $?"
            echo ""
            echo "=== F: v0.5.5 --target b66d742 (коммит слияния main в ветку)"
            gh release create "v0.5.5" test-asset.txt --repo "$GH_REPO" \
              --target "b66d742" --title "0.5.5" --notes-file notes.md 2>&1
            echo "код: $?"
          } > check.txt 2>&1

      - name: Уборка
        if: always()
        run: |
          for tag in v0.5.1 v0.5.2 v0.5.3 v0.5.4 v0.5.5; do
            gh api -X DELETE "repos/$GH_REPO/releases/tags/$tag" >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
          done
          echo "уборка сделана" >> check.txt

      - name: Результат в комментарий PR #2
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment 2 --repo "$GH_REPO" --body-file check.txt || true
