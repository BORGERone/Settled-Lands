name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Отключает дорогую рекомпиляцию исходников Minecraft: быстрее и без лишней памяти.
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        # Файл, загруженный через веб-интерфейс GitHub, теряет флаг исполняемости.
        run: chmod +x gradlew

      - name: Статические проверки (без JDK и без запуска игры)
        run: python3 tools/static-check.py

      - name: Сборка и unit-тесты
        run: ./gradlew build --no-daemon

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: settledlands-jar
          path: build/libs/*.jar
          if-no-files-found: error
